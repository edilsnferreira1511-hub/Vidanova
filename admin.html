<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel — VIAL KIDS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="adminwrap">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <h1>VIAL KIDS · Painel</h1>
    <div><a href="index.html" class="smallbtn" style="text-decoration:none">Ver loja</a> <button class="smallbtn" id="btnOut" hidden>Sair</button></div>
  </div>

  <div id="loginCard" class="card" hidden>
    <h3 style="margin-top:0">Entrar</h3>
    <form id="loginForm">
      <label>E-mail</label><input id="lEmail" type="email" required>
      <label>Senha</label><input id="lPass" type="password" required>
      <p class="msg" id="lMsg"></p>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </div>

  <div id="denied" class="card" hidden>
    <p>Esta conta não tem permissão de administrador. Veja no README como liberar o seu acesso.</p>
    <p style="font-size:12px">Seu UID: <code id="uid"></code></p>
  </div>

  <div id="panel" hidden>
    <div class="tabs"><button class="active" data-t="products">Produtos</button><button data-t="orders">Pedidos</button></div>

    <section id="tProducts">
      <div class="card">
        <h3 style="margin-top:0" id="formTitle">Novo produto</h3>
        <form id="pForm">
          <div class="grid2">
            <div><label>Nome</label><input id="pName" required></div>
            <div><label>Categoria</label><select id="pCat"><option>RN</option><option>Bebês</option><option>Infantil</option></select></div>
            <div><label>Preço (R$)</label><input id="pPrice" type="number" step="0.01" min="0.01" required></div>
            <div><label>Tamanhos e estoque</label><input id="pSizes" placeholder="Ex.: RN:3, P:5, M:2" required></div>
          </div>
          <label>Descrição</label><textarea id="pDesc" rows="2"></textarea>
          <label>Fotos</label>
          <div class="thumbs" id="pThumbs"></div>
          <input id="pFiles" type="file" accept="image/*" multiple>
          <label style="display:flex;gap:8px;align-items:center"><input id="pActive" type="checkbox" checked style="width:auto;margin:0"> Visível na loja</label>
          <p class="msg" id="pMsg"></p>
          <button class="primary" type="submit" id="pSave">Salvar produto</button>
          <button class="smallbtn" type="button" id="pCancel" hidden style="margin-left:8px">Cancelar edição</button>
        </form>
      </div>
      <div class="plist" id="pList"></div>
    </section>

    <section id="tOrders" hidden><div id="oList">Carregando…</div></section>
  </div>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
